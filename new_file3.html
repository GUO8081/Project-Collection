<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品详情 | 站酷风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        /* 顶部导航栏 */
        nav {
            background: #ffffff;
            border-bottom: 1px solid #e6e6e6;
            padding: 0 20px;
            position: sticky;
            top:0;
            z-index: 100;
        }
        .nav-wrap {
            max-width: 1100px;
            margin: 0 auto;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color:#333;
            text-decoration: none;
        }
        .nav-menu a {
            color:#666;
            text-decoration: none;
            margin-left:24px;
            font-size:15px;
        }
        .nav-menu a:hover {
            color:#0099ff;
        }
        /* 主体容器 */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding:0 20px;
        }
        /* 作品头部信息 */
        .work-header {
            background:#fff;
            padding:24px;
            border-radius:8px 8px 0 0;
        }
        .work-header h1 {
            font-size:26px;
            margin-bottom:10px;
        }
        .author-info {
            display:flex;
            align-items:center;
            gap:12px;
            color:#777;
            font-size:14px;
            margin-bottom:16px;
        }
        .tag-group span {
            display:inline-block;
            background:#f0f0f0;
            color:#555;
            font-size:13px;
            padding:4px 10px;
            border-radius:16px;
            margin-right:8px;
        }
        /* 作品图片区域 */
        .work-images {
            background:#fff;
            padding:0 24px 24px;
        }
        .work-images img {
            width:100%;
            margin-bottom:16px;
            border-radius:4px;
        }
        /* 作品正文描述 */
        .work-desc {
            background:#fff;
            padding:24px;
            border-radius:0 0 8px 8px;
            margin-bottom:30px;
        }
        .work-desc h3 {
            margin-bottom:12px;
            font-size:18px;
        }
        .work-desc p {
            color:#444;
            font-size:15px;
        }
        /* 底部 */
        footer {
            text-align:center;
            padding:30px;
            color:#888;
            font-size:14px;
        }
    </style>
</head>
