<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>图片测试页面</title> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .img-box {
            max-width: 1200px;
            margin: 0 auto;
        }
        .img-box img {
            width: 100%;
            margin-bottom:20px;
            border-radius:8px;
            box-shadow: 0 2px 8px #00000022;
        }
    </style>
</head>
<body>
    <h2>图片测试网页</h2>
    <div class="img-box">
        <!-- 网络图片链接，可直接替换成你自己图片的https图床链接 -->
        <img src="https://t.tutu.to/img/Wsb8" alt="测试图1">
        <img src="https://beeimg.us.ci/temp/b9940c83cff9f718bc537503f3da4779.png" alt="测试图2">
        <img src="https://beeimg.us.ci/temp/30a5ec2e08bf123a421c9c41c78ef8e7.png" alt="测试图3">
    </div>
</body>
</html>
